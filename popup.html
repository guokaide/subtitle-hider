<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Hider</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <h1 class="title">Subtitle Hider</h1>
        <span class="status-pill" id="statusText">Off</span>
      </div>
      <p class="subtitle">Hide hard-coded subtitles with a precision mask.</p>
    </header>

    <section class="card">
      <div class="card-row">
        <div class="card-text">
          <div class="card-title">Hider</div>
          <div class="card-sub">Toggle for this tab</div>
        </div>
        <button id="toggleBtn" class="toggle-switch" aria-label="Toggle subtitle hider">
          <span class="toggle-slider" id="toggleIndicator"></span>
        </button>
      </div>
    </section>

    <section class="card">
      <div class="card-row">
        <div class="card-text">
          <div class="card-title">Effect</div>
          <div class="card-sub">Blur or dark mask</div>
        </div>
        <div class="segmented" role="tablist" aria-label="Effect">
          <button class="seg-btn" data-effect="blur" aria-pressed="true">Blur</button>
          <button class="seg-btn" data-effect="mask" aria-pressed="false">Mask</button>
        </div>
      </div>
    </section>

    <section class="tips">
      <div class="tip">
        <span class="tip-key">⌘⇧S</span>
        <span class="tip-text">toggle</span>
      </div>
      <div class="tip">
        <span class="tip-key">drag</span>
        <span class="tip-text">move</span>
      </div>
      <div class="tip">
        <span class="tip-key">scroll</span>
        <span class="tip-text">resize</span>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
