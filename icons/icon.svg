<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 白色背景 -->
  <rect x="0" y="0" width="128" height="128" fill="#ffffff"/>

  <!-- 浅蓝色圆形背景（更大） -->
  <circle cx="64" cy="64" r="58" fill="#e3f2fd"/>

  <!-- 字幕框（放大） -->
  <rect x="18" y="40" width="92" height="48" rx="10" fill="#87CEEB" stroke="#5cacee" stroke-width="3"/>

  <!-- 字幕线条（更粗） -->
  <line x1="32" y1="58" x2="96" y2="58" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="74" x2="80" y2="74" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- 红色禁止符号（更大） -->
  <circle cx="102" cy="26" r="22" fill="#ff6b6b" opacity="0.95"/>
  <line x1="86" y1="10" x2="118" y2="42" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>
